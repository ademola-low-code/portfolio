name: Publish blog post

on:
  schedule:
    # 07:12 UTC = 08:12 Lagos — Mon, Wed, Fri, Sun (4 posts a week)
    - cron: '12 7 * * 1,3,5,0'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: publish-post
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Write the post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER: ${{ vars.PROVIDER || 'gemini' }}
        run: node scripts/generate-post.js

      - name: Rebuild the blog
        run: npm run build

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed — no post today."
            exit 0
          fi
          TITLE=$(cat .new-post-title 2>/dev/null || echo "new article")
          rm -f .new-post-title
          git config user.name  "blog-bot"
          git config user.email "usmanganiyu1596@gmail.com"
          git add -A
          git commit -m "post: ${TITLE}"
          # main may have moved since checkout; rebase on top rather than fail
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing on origin/main (attempt $i)"
            git pull --rebase origin main || exit 1
          done
          git push
